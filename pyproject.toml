[project]
name = "burger-support"
version = "0.1.0"
description = "Burger VPN support bot: user messages -> forum topics in the support group"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles==24.1.0",
    "aiogram>=3.23.0,<4.0.0",
    "aiosqlite>=0.22.1",
    "anthropic>=1.11.0",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "pydantic-settings>=2.12.0,<3.0.0",
    "pypdf>=6.21.4",
    "watchfiles>=1.0.0,<2.0.0",
]

[dependency-groups]
test = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
